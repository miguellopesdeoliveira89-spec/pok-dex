<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Pokémon</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">

        <section class="formulario">
            <h2>Novo Cadastro</h2>

            <form id="formPokemon">

                <div class="campo">
                    <label for="treinador">Nome do treinador:</label>
                    <input
                        type="text"
                        id="treinador"
                        placeholder="Digite o nome do treinador"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="pokemon">Escolha o Pokémon:</label>
                    <select id="pokemon" required>
                        <option value="">Selecione um Pokémon</option>
                        <option value="Pikachu">Pikachu</option>
                        <option value="Charmander">Charmander</option>
                        <option value="Squirtle">Squirtle</option>
                        <option value="Bulbasaur">Bulbasaur</option>
                        <option value="Eevee">Eevee</option>
                        <option value="Gengar">Gengar</option>
                        <option value="Dragonite">Dragonite</option>
                        <option value="Lucario">Lucario</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo do Pokémon:</label>
                    <select id="tipo" required>
                        <option value="">Selecione o tipo</option>
                        <option value="Normal">Normal</option>
                        <option value="Fogo">Fogo</option>
                        <option value="Água">Água</option>
                        <option value="Elétrico">Elétrico</option>
                        <option value="Planta">Planta</option>
                        <option value="Venenoso">Venenoso</option>
                        <option value="Fantasma">Fantasma</option>
                        <option value="Dragão">Dragão</option>
                        <option value="Lutador">Lutador</option>
                        <option value="Aço">Aço</option>
                        <option value="Psíquico">Psíquico</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cp">Combat Power (CP):</label>
                    <input
                        type="number"
                        id="cp"
                        placeholder="Ex.: 1200"
                        min="1"
                        max="10000"
                        step="1"
                        required
                    >
                </div>

                <button type="submit">Cadastrar Pokémon</button>
            </form>
        </section>

        <section class="lista">
            <h2>Pokémon Cadastrados</h2>

            <p id="mensagem">
                Nenhum Pokémon cadastrado ainda.
            </p>

            <div id="listaPokemon" class="cards"></div>
        </section>

    </main>
</body>
</html>
