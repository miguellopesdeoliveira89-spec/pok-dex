<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 18 - Arena Pokémon</title>
</head>
<body>
    
    <h1>Cadastre seu Pokémon</h1>

    <div id="pokemon" class="pokemon"></div>
        <label for="pokemon">Escolha seu Pokémon</label>
        <input type="text" name="" id="nome" placeholder="Digite o nome do Pokémon">
    
    <div id="treinador" class="treinador"></div>
        <label for="treinador">Escolha o nome do seu treinador</label>
        <input type="text" name="" id="treinador" placeholder="Digite o nome do treinador">
    
    <div id="tipo" class="Tipo"></div>
        <label for="Tipo">Escolha o tipo do seu Pokémon</label>
        <input type="text" name="" id="tipo" placeholder="Digite o tipo do Pokémon">
    
    <div id="cp" class="CP"></div>
        <label for="CP">Escolha o poder de combate do seu Pokémon</label>
        <input type="number" name="" id="cp" placeholder="Digite o CP do Pokémon">
        <button type="submit">Cadastrar</button>
    </div>

    <div id="arena" class="arena"></div>
        <h2>Arena Pokémon</h2>
        <div id="pokemon-cards" class="pokemon-cards"></div>
        <button id="sort-button">Ordenar por CP</button>
    </div>

    <script src="Aula 18 script.js"></script>

    </div>

</body>
</html>
